<style>
:root{color-scheme:light;--tigo:#0A5CFF;--tigo2:#0A5CFF;--acc:#0A5CFF;--acct:#0A5CFF;--accsoft:rgba(10,92,255,.08);--bg:#F5F7FB;--s:#FFFFFF;--s2:#F1F4F9;--s3:#E6EBF3;--tx:#0A1020;--dim:#5E6A82;--bd:#E1E6F0;--ok:#0C8F5F;--warn:#A86400;--err:#D63A4A;--inp:#FFFFFF;--hv:#EEF2FA;--toast:#0A1020;--toastc:#fff;--glow:none;--tagok:#DDF4EA;--tagerr:#FCE3E5}
[data-theme="dark"]{color-scheme:dark;--tigo:#2F6BFF;--tigo2:#7FB2FF;--acc:#2F6BFF;--acct:#8DBBFF;--accsoft:rgba(47,107,255,.18);--bg:#05070D;--s:rgba(255,255,255,.035);--s2:rgba(255,255,255,.05);--s3:rgba(255,255,255,.09);--tx:#EAF0FF;--dim:#8795B3;--bd:rgba(255,255,255,.09);--ok:#3DDC97;--warn:#FFC24D;--err:#FF6B7A;--inp:rgba(255,255,255,.04);--hv:rgba(255,255,255,.07);--toast:#141B2D;--toastc:#EAF0FF;--glow:0 0 18px rgba(47,107,255,.55);--tagok:rgba(61,220,151,.14);--tagerr:rgba(255,107,122,.14)}
*{box-sizing:border-box;font-family:Geist,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{margin:0;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
[data-theme="dark"] body{background-color:var(--bg);background-image:radial-gradient(900px 360px at 50% 0,rgba(47,107,255,.2),transparent 70%);background-repeat:no-repeat;background-attachment:fixed}
.mono{font-family:"Geist Mono",ui-monospace,Consolas,monospace}
header{position:sticky;top:0;z-index:5;background:var(--bg);background:color-mix(in srgb,var(--bg) 93%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);padding:12px 20px 0}
.w{max-width:1100px;margin:0 auto}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:50%;background:transparent;color:var(--acct);border:1.5px solid var(--acc);display:grid;place-items:center;font-weight:600;font-size:16px;box-shadow:var(--glow)}
header b{font-weight:600;letter-spacing:-.01em}
.dim{color:var(--dim)}.sm{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 11px;border-radius:99px;background:transparent;border:1px solid var(--bd);color:var(--dim)}
.pill.ok::before,.pill.warn::before,.pill.err::before,.pill.dim::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:8px}
button{cursor:pointer;border:1px solid transparent;border-radius:10px;color:var(--tx);background:var(--s3);font-size:14px;font-weight:500;padding:0 14px;height:42px;transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
button:hover:not(:disabled){border-color:var(--acc)}

.tabs .on,.tabs .on:hover:not(:disabled){color:var(--tx);border-bottom-color:var(--acc);box-shadow:0 8px 14px -10px var(--acc)}
.pri{background:var(--acc);color:#fff;width:100%;height:48px;font-size:15px;font-weight:600;box-shadow:var(--glow)}
.pri:hover:not(:disabled){background:var(--acc);border-color:#fff;filter:brightness(1.12)}
main{max-width:1100px;margin:0 auto;padding:28px 20px 90px}
.grid{display:grid;gap:20px}@media(min-width:900px){.grid.two{grid-template-columns:1.1fr .9fr}}
.card{background:var(--s);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.ch{padding:15px 22px 15px 40px;background:radial-gradient(circle,var(--acc) 0 3px,transparent 4px) 20px 50%/8px 8px no-repeat;border-bottom:1px solid var(--bd);font-size:13px;font-weight:500;color:var(--dim);text-transform:lowercase}
.ch::first-letter,label::first-letter,.stat>span:first-child::first-letter{text-transform:uppercase}
.cb{padding:22px;display:grid;gap:16px}
h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--tx)}
label{display:block;font-size:12px;font-weight:500;color:var(--dim);text-transform:lowercase}

.x{height:32px;padding:0 12px;background:transparent;border-color:var(--bd);color:var(--dim);font-size:13px}.x:hover:not(:disabled){color:var(--tx);border-color:var(--tx)}
.x.dn{color:var(--err);border-color:var(--err)}.x.dn:hover:not(:disabled){background:var(--err);color:#fff;border-color:var(--err)}
header .x{height:30px;padding:0 11px;font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--dim);background:transparent}
.tag.ok{background:var(--tagok);border-color:transparent;color:var(--ok)}.tag.err{background:var(--tagerr);border-color:transparent;color:var(--err)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}
.bar{height:3px;background:var(--s3);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;box-shadow:var(--glow)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:transparent;border:1px solid var(--bd);border-radius:12px;padding:14px}
.stat>span:first-child{display:block;text-transform:lowercase}
.stat b{display:block;font-size:19px;font-weight:600;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
pre{background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:12px;overflow:auto;max-height:200px;margin:0;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--toast);color:var(--toastc);border:1px solid var(--bd);border-left:3px solid var(--acc);padding:11px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:92vw;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.stb{height:34px;padding:0 13px;font-size:13px;background:transparent;border:1px solid var(--bd);border-radius:99px}
.stb.g{color:var(--ok);border-color:var(--ok)}.stb.g.on{background:var(--ok);color:#04150E}
.stb.b{color:var(--acct);border-color:var(--acc)}.stb.b.on{background:var(--acc);color:#fff}
.stb.y{color:var(--warn);border-color:var(--warn)}.stb.y.on{background:var(--warn);color:#1E1300}
.blu{color:var(--acct)}
.empty{padding:28px;text-align:center;color:var(--dim);font-size:14px}
@media(max-width:520px){#cnt,header .logo+div .dim{display:none}header .row.mono{gap:6px}.tabs button{font-size:12px;padding:0 2px}main{padding:18px 12px 90px}header{padding:10px 12px 0}.cb{padding:16px}.item{padding:12px 14px}.ch{padding-left:38px}}

@media(min-width:700px){main{max-width:1280px;padding:28px 28px 80px}.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.opts{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));max-height:420px}}

  header .w{max-width:none;width:100%}
  .tabs{position:fixed;left:0;top:68px;bottom:0;width:224px;display:flex;flex-direction:column;gap:4px;margin:0;padding:18px 14px;border-right:1px solid var(--bd);background:var(--bg);z-index:4;overflow:auto}
  .tabs button{height:44px;text-align:left;padding:0 14px;font-size:14px;border:0;border-left:3px solid transparent;border-radius:10px}
  .tabs button:hover:not(:disabled){background:var(--hv)}
  .tabs .on,.tabs .on:hover:not(:disabled){background:var(--accsoft);border-left-color:var(--acc);color:var(--acct);box-shadow:none}
  main{max-width:1500px;margin:0 0 0 224px;padding:30px 36px 80px}
  .grid.two{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px}
  .cb{padding:26px}.item{padding:14px 26px}.ch{padding-left:44px}
  h2{font-size:24px}
  #rlist,.opts{scrollbar-width:thin}
}
.reinc{border:1px solid #d97706;background:rgba(217,119,6,.12);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
#rbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;padding:10px 12px 10px 16px;border-radius:14px;z-index:50;display:flex;gap:12px;align-items:center;font-size:14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#rbar button{width:auto;height:34px;padding:0 14px;background:#fff;color:#0A5CFF;border:0;border-radius:9px;font-weight:600}
.rep{white-space:pre-wrap;font:13px/1.5 "Geist Mono",monospace;background:var(--hv);border-radius:10px;padding:12px;margin:0 0 12px}
.cols{display:flex;gap:3px;align-items:flex-end;height:130px}.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:var(--dim)}
.col i{display:block;width:100%;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}.col em{font-style:normal;margin-bottom:2px}.col span{margin-top:3px}
.kb,.kbh{display:none}
.opt.lr{border-style:dashed}.opt.lr::before{content:"✦ ";color:var(--acc)}
.hr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:start}.hr>*{grid-column:1;min-width:0}.hr .ha{grid-column:2;grid-row:1/span 3}
.hr .hd{overflow-wrap:anywhere;white-space:pre-line}.hh{display:none}
@media(min-width:1024px){.kb{display:inline-block;margin-right:8px;min-width:18px;text-align:center;font:500 11px "Geist Mono",monospace;border:1px solid var(--bd);border-radius:5px;padding:1px 4px;color:var(--dim)}.kbh{display:block}}
@media(min-width:1280px){.grid.rec{grid-template-columns:minmax(360px,420px) minmax(0,1fr)}.rec .opts{grid-template-columns:1fr}}
@media(min-width:1600px){   /* tabla real solo cuando hay lugar para la columna Detalle */
  .hr,.hh{grid-template-columns:120px 160px minmax(200px,1fr) 160px 76px;gap:14px}.hr>*,.hr .ha{grid-column:auto;grid-row:auto}
  .hr .ha{flex-direction:column;align-items:stretch}
  .hh{display:grid;padding:10px 26px;font-size:11px;color:var(--dim);border-bottom:1px solid var(--bd);text-transform:uppercase;letter-spacing:.04em}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="w">
  <div class="row">
    <div class="row" style="justify-content:flex-start"><div class="logo">T</div><div><b style="font-size:17px;font-weight:800">Control Tigo</b><div class="sm dim">Paraguay · Comercial</div></div></div>
    <div class="row mono sm"><button class="x" id="theme"></button><span id="cnt" class="dim"></span><span id="net" class="pill"></span><span id="st" class="pill"></span><button class="x" id="hlogout" style="display:none">Salir</button></div>
  </div>
  <div class="tabs" id="tabs"></div>
</div></header>
<main id="main"></main>
<div id="toast" class="toast" style="display:none"></div>

<script>
"use strict";
// URL del Apps Script (termina en /exec). Si la pones aqui, nadie tiene que escribirla y los agentes nunca la ven.
const URL_FIJA = "https://script.google.com/macros/s/AKfycby9mZfy7YfDH4GH2iTtc98L5Oiw6Mg3-rtZlIG67l1p_MJK2D0uI9rkrJ00wNR5S_rkzA/exec";
const KEY = "tigo_control_v16_prueba";   // clave propia: la prueba no toca los datos de tu version real
const PLANES = [60,75,85,95,110,130,160,210,270];
const CICLOS = [1,7,15,21];   // dias de ciclo de facturacion: un cambio programado se aplica en el proximo ciclo
// Proximo ciclo posterior a la fecha de la llamada. Despues del 21 pasa al dia 1 del mes siguiente.
function proxCiclo(from, dia) {
  const b = from ? new Date(from) : new Date(), y = b.getFullYear(), m = b.getMonth(), d = b.getDate();
  if (dia) return dia > d ? new Date(y, m, dia) : new Date(y, m + 1, dia);   // ciclo elegido: su proxima fecha
  const c = CICLOS.find(x => x > d);
  return c ? new Date(y, m, c) : new Date(y, m + 1, CICLOS[0]);
}
const fcorta = d => `${("0" + d.getDate()).slice(-2)}/${("0" + (d.getMonth() + 1)).slice(-2)}/${d.getFullYear()}`;
const MOT_BASE = ["Cancelación","No puedo navegar","Detalles de factura monto y cto","Activación no reconocida","Roaming","Baja no procesada","Consulta de saldo","Préstamo de saldo","Transferencia de saldo","Consulta de planes","Aplicaciones externas","Aplicaciones Tigo","Spam","Solicitudes no procesadas","Transferencia de pago","Pago no registrado","Pago mal aplicado","Inconvenientes con simcard","buzon de voz","Estado de linea","Bloqueo de linea","portabilidad","Agendamiento de llamada","Inconvenientes con llamadas","Inconvenientes con sms","DESASOCIACION DE BTM","DESBLOQUEO DE EQUIPO","reset de pin btm","btm reversion","Refinanciacion","Transferencia a ventas,home, ivr","Otros"];

/* ---------- Almacenamiento persistente (sobrevive al refresh) ---------- */
let S = { theme: "", accts: [], motList: null, motDirty: 0, motSrv: undefined, rec: [], ven: [], url: "", key: "", user: "", pass: "", ok: false, uh: [], role: "", rl: {}, authBad: 0, auto: true, last: "", lastErr: "" };
const gated = () => !S.ok;
// Unico administrador fijo (se guarda solo el hash, no la contraseña). Todos los demas usuarios son agentes.
const ADMIN_USER = "expnww", ADMIN_H = "v2:09cb1b79774a988e7cca22724428384867e96a036e805c403fa8bc31a284285b";
const canEdit = r => isAdmin() || (!!r.agent && r.agent === S.user);   // el agente solo toca lo suyo; el admin todo
const lv = k => live(S[k]).filter(canEdit);   // lo que cada usuario puede ver: el agente solo lo suyo
const NOPERM = () => toast("Solo podés modificar tus propios registros");
/* Detalles rapidos por motivo: se tocan en el Paso 3 y se agregan al detalle (tocar de nuevo los quita) */
const QUICK = {
  "aplicaciones externas": ["Inconvenientes con WhatsApp", "Se envía link de ayuda de WhatsApp", "Se brinda info para proteger su WhatsApp", "No es tema de Tigo, se transfiere a asesor"],
  "no puedo navegar": ["Reseteo de datos", "Se realiza configuración de APN", "Se restablece configuración de red", "Datos móviles apagados", "Zona reportada", "Se aprovisiona la línea", "Sin gigas", "Sin saldo", "Cliente en corte", "Inconvenientes con cobertura"],
  "cancelación": ["Económicos", "Disconforme", "Cobertura en la zona", "Va a activar el plan en otra línea", "Tercero solicita cancelación", "Se indica abonar factura vencida para cancelar"],
  "detalles de factura monto y cto": ["TT solicita detalles de factura", "Quiere saber su ciclo de facturación", "Cliente solicita su nro de contrato", "Cliente solicita fecha de cto de la fact", "Se indica que se acerque por tiendas", "Parcial por mora, corte", "Ajuste de factura"],
  "buzon de voz": ["Desactivación de buzón de voz", "No recuerda la clave, se transfiere a asesor", "No se desactivó en gestión anterior, se transfiere a asesor"],
  "inconvenientes con simcard": ["Inconvenientes con e-SIM", "Se indica que realice cambio de SIM card", "Info sobre activación de SIM card virgen", "Eliminación de línea es únicamente por tiendas", "Inconvenientes con la línea"],
  "estado de linea": ["Estado de línea", "Línea en corte", "Se indica que pruebe en otro dispositivo", "Se brinda info"],
  "otros": ["Solicita eliminación de línea", "Info sobre Paquetigo", "Info sobre estado de solicitud", "Home"],
  "consulta de planes": ["Solicita disminución de plan", "Se realiza cambio de plan", "Se brinda info sobre planes"],
  "solicitudes no procesadas": ["Promo no aplicada", "Se solicita escucha de llamada para verificación", "A pedido de TT"],
  "portabilidad": ["Se deriva a portabilidad", "Transferencia", "Portabilidad"],
  "bloqueo de linea": ["A pedido de TT se realiza bloqueo de línea"],
  "agendamiento de llamada": ["Callback sin éxito, se deja buzón de voz", "Busy", "Agendamiento de llamada"],
  "roaming": ["Consulta de paquetitos para roaming", "Inconvenientes con roaming", "Se aprovisiona la línea para el funcionamiento del roaming", "Cliente sin gigas para roaming", "Inconvenientes con e-SIM en roaming"],
  "aplicaciones tigo": ["Inconvenientes con Mi Tigo"],
  "inconvenientes con llamadas": ["Se realizan comandos (##21#, ##67#, #31#, ##002#)", "Inconvenientes con llamadas"],
  "inconvenientes con sms": ["Inconvenientes con SMS"],
  "desasociacion de btm": ["Desasociación de BTM"],
  "reset de pin btm": ["Reset de PIN BTM"],
  "btm reversion": ["Reversión de transacción BTM"],
  "desbloqueo de equipo": ["Solicita código de desbloqueo"],
  "refinanciacion": ["Solicita refinanciación"],
  "transferencia a ventas,home, ivr": ["Transferencia a IVR / Home"],
  "iconvenientes con llamadas": ["Se realizan comandos (##21#, ##67#, #31#, ##002#)", "Inconvenientes con llamadas"],
  "inconvenientes llamada": ["Se realizan comandos (##21#, ##67#, #31#, ##002#)", "Inconvenientes con llamadas"]
};
const qkey = m => String(m || "").toLowerCase().trim();
const quickBase = m => (S.quick && Array.isArray(S.quick[qkey(m)])) ? S.quick[qkey(m)] : (QUICK[qkey(m)] || []);   // lo que edita el admin pisa lo original
const qcount = (m, t) => live(S.rec).filter(r => qkey(r.type) === qkey(m) && String(r.desc || "").toLowerCase().includes(t.toLowerCase())).length;
/* Aprende de lo que ya escribiste: frases repetidas (>= N veces) en el detalle de cada motivo pasan a ser ítems rápidos */
function learnedFor(m) {
  if (S.qlearn === 0) return [];
  const k = qkey(m), min = S.qlearnMin || 3, base = quickBase(m), hide = new Set(((S.qhide || {})[k] || []).map(x => x.toLowerCase())), c = {};
  const strip = base.slice().sort((a, b) => b.length - a.length).map(t => new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"));
  live(S.rec).forEach(r => { if (qkey(r.type) !== k) return;
    let d = String(r.desc || ""); strip.forEach(re => d = d.replace(re, "\n"));   // lo que ya es ítem fijo no se vuelve a "aprender" en pedazos
    new Set(d.split(/[\n;,]+|\.\s+/).map(x => x.trim().replace(/[.\s]+$/, "")).filter(x => x.length >= 4 && x.length <= 70 && !/\d{4,}|@|https?:/i.test(x))).forEach(x => { const l = x.toLowerCase(); (c[l] = c[l] || { t: x, n: 0 }).n++; }); });   // sin números largos (teléfonos, cédulas)
  return Object.values(c).filter(o => o.n >= min && !hide.has(o.t.toLowerCase())).sort((a, b) => b.n - a.n).slice(0, 8).map(o => o.t);
}
const quickFor = m => { const b = quickBase(m).concat(learnedFor(m)); if (S.qsort === false || !b.length) return b;   // mas usados primero; empate = orden configurado
  return b.map((t, i) => [t, qcount(m, t), i]).sort((x, y) => y[1] - x[1] || x[2] - y[2]).map(x => x[0]); };
const quickHas = t => (F.desc || "").includes(t);
function quickToggle(t) {
  let d = F.desc || "";
  if (d.includes(t)) d = d.replace(new RegExp("(,\\s*)?" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(\\s*,\\s*)?"), (m, a, b) => a && b ? ", " : "").trim();
  else d = d.replace(/[\s,]+$/, "") + (d.trim() ? ", " : "") + t;
  F.desc = d; render();
}

const nrm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").split(/[^a-z0-9]+/).filter(w => w && !/^(con|de|del|la|el|a|en|y)$/.test(w)).map(w => w.replace(/s$/, "")).join(" ");

  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[a.length][b.length]; };
function tidyData() {
  const use = {}, ml = getMot(); live(S.rec).forEach(r => { if (r.type) use[r.type] = (use[r.type] || 0) + 1; });
  const names = [...new Set(ml.concat(Object.keys(use)))], groups = [];
  names.forEach(n => { const k = nrm(n), g = groups.find(g => g.k === k || (k.length > 7 && lev(g.k, k) <= 2)); g ? g.n.push(n) : groups.push({ k, n: [n] }); });
  groups.forEach(g => g.n.sort((a, b) => (use[b] || 0) - (use[a] || 0) || (ml.includes(b) ? 1 : 0) - (ml.includes(a) ? 1 : 0)));
  const dup = groups.filter(g => g.n.length > 1), inDup = new Set(dup.flatMap(g => g.n));

  S.rec.forEach(r => { if (others.includes(r.type) && canEdit(r)) { r.type = canon; r.updatedAt = now(); r._d = 1; ch++; } });
  if (S.quick) others.forEach(o => { const k = qkey(o); if (S.quick[k] && k !== qkey(canon)) { S.quick[qkey(canon)] = [...new Set((S.quick[qkey(canon)] || quickBase(canon)).concat(S.quick[k]))]; delete S.quick[k]; } });

    <div class="sm dim">Nombres casi iguales (tipeo o mayúsculas). Unificar corrige también los registros ya guardados y los reenvía al Sheet.</div>
    ${t.dup.map((g, i) => `<div class="stat"><div class="sm">${g.n.map(n => `${esc(n)} <span class="dim mono">(${t.use[n] || 0})</span>`).join(" · ")}</div><div class="chips" style="margin-top:10px">${g.n.map((n, j) => `<button class="opt" data-merge="${i}:${j}">Dejar «${esc(n)}»</button>`).join("")}</div></div>`).join("") || `<div class="sm ok">No hay motivos duplicados</div>`}
    ${t.out.length ? `<label>USADOS EN REGISTROS PERO FUERA DE LA LISTA</label><div class="chips">${t.out.map(n => `<button class="opt" data-madd="${esc(n)}">+ ${esc(n)} <span class="dim sm">${t.use[n]}</span></button>`).join("")}</div>` : ""}
  </div></div>`;
}
function render() {
  const g = gated();
  $("#cnt").textContent = g ? "" : `${S.user ? S.user + (isAdmin() ? " (admin)" : "") + " • " : ""}${lv("rec").length} recontactos • ${lv("ven").length} ventas`;
  $("#net").textContent = g ? "" : gs(lv("ven").reduce((a, r) => a + r.neta, 0)) + " neto";
  $("#net").style.display = g ? "none" : ""; $("#hlogout").style.display = g ? "none" : "";
  const TB = [["res", "Resumen"], ["rec", "Recontactos"], ["ven", "Ventas & Metas"], ["cfg", "Configuración"]].concat(isAdmin() ? [["usr", "Admin"]] : []);
  if (tab === "usr" && !isAdmin()) tab = "rec";
  $("#tabs").style.gridTemplateColumns = `repeat(${TB.length},1fr)`;
  $("#tabs").innerHTML = gated() ? "" : TB.map(t => `<button data-tab="${t[0]}" class="${tab === t[0] ? "on" : ""}">${t[1]}</button>`).join("");
  $("#main").innerHTML = gated() ? vLogin() : tab === "res" ? vRes() : tab === "rec" ? vRec() : tab === "ven" ? vVen() : tab === "usr" ? vUsr() : vCfg();
  setSt(); remBar();
  if (gated()) { const el = $(S.user && $("#l-go") ? "#l-pass" : "#l-user"); if (el) el.focus(); }
  else if (tab === "rec") { const el = $("#f-phone") || $("#f-q") || $("#f-desc"); if (el) { el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch (x) {} } }
}

/* ---------- Eventos (delegados) ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset, id = b.id;
  if (d.tab) { tab = d.tab; render(); scrollTo(0, 0); if (tab === "usr") loadUsers(); }
  else if (d.mdel) motDel(+d.mdel);
  else if (d.qup != null || d.qdn != null || d.qdel != null) qEdit(d);
  else if (id === "rbar-go") { tab = "rec"; RF.f = "all"; render(); scrollTo(0, 0); }
  else if (id === "p-notif") { if ("Notification" in window) Notification.requestPermission().then(render); }
  else if (id === "p-share") { if (isAdmin()) { S.motDirty = 1; S.motSrv = undefined; S.cfgSrv = undefined; cfgTouch(); pushMot(); toast("Subiendo configuración al Sheet…"); } }
  else if (id === "rep-copy") copyTxt(REPTXT);
  else if (id === "rep-wa") window.open("https://wa.me/?text=" + encodeURIComponent(REPTXT), "_blank");
  else if (id === "q-add") qAdd();
  else if (d.lfix != null || d.lhide != null) { if (!isAdmin()) return; const m = qm(), t = learnedFor(m)[+(d.lfix ?? d.lhide)]; if (!t) return;
    if (d.lfix != null) qSet(m, quickBase(m).concat(t)); else { S.qhide = S.qhide || {}; (S.qhide[qkey(m)] = S.qhide[qkey(m)] || []).push(t); cfgTouch(); render(); } }
  else if (id === "q-reset") { if (isAdmin() && S.quick) { delete S.quick[qkey(qm())]; cfgTouch(); render(); toast("Originales restaurados"); } }
  else if (d.merge != null) tidyMerge(d.merge);
  else if (d.madd != null) { if (isAdmin()) motSave(getMot().concat(d.madd), "Motivo agregado: " + d.madd); }
  else if (id === "m-add") motAdd();
  else if (id === "m-reset") motReset();
  else if (id === "u-new") { U.f = { user: "", pass: "", role: "agente" }; render(); }
  else if (d.uact) { const k = d.uact.indexOf(":"); userAct(d.uact.slice(0, k), d.uact.slice(k + 1)); }
  else if (d.go) { F.step = +d.go; render(); }
  else if (d.m) { F.type = d.m; render(); }
  else if (d.qd != null) { const t = quickFor(F.type)[+d.qd]; if (t) quickToggle(t); }
  else if (d.res) { F.res = d.res === "1"; render(); }
  else if (d.enc) { F.enc = d.enc; render(); }
  else if (d.cp) { const [k, t] = d.cp.split(":"); copiar(k, t === "1"); }
  else if (d.edit) { const [k, i] = d.edit.split(":"); k === "rec" ? editRec(i) : editVen(i); }
  else if (d.rf) { RF.f = d.rf; updRec(); }
  else if (d.vf) { VF = d.vf; render(); }
  else if (d.sf) { SF = d.sf; if (SF === "hoy") SD = ymd(new Date()); render(); }
  else if (d.sd) { const [y, m, dd] = SD.split("-").map(Number), n = new Date(y, m - 1, dd + +d.sd); if (n <= new Date()) { SD = ymd(n); render(); } }
  else if (d.st) { const [i, k] = d.st.split("|"); setEstado(i, k); }
  else if (d.t) { V.type = d.t; render(); }
  else if (d.ap) { V.apl = d.ap; render(); }
  else if (d.ci) { V.ciclo = +d.ci; render(); }
  else if (d.p) { const box = b.parentElement.id; if (box === "pa") V.ant = +d.p; else V.nuevo = +d.p; render(); }
  else if (d.del) { const [k, i] = d.del.split(":"); del(k, i); }
  else if (id === "n1") { F.step = 2; render(); }
  else if (id === "n2") { F.step = 3; render(); }
  else if (id === "cancelEdit") { F = F0(); render(); }
  else if (id === "cancelEditV") { V.editId = null; V.number = ""; render(); }
  else if (id === "u-save") userSave();
  else if (id === "save") saveRec();
  else if (id === "sv") saveVen();
  else if (id === "usave") { const u = $("#url").value.trim(); if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(u)) return toast("Debe ser la URL https://script.google.com/.../exec"); S.url = u; save(); toast("Guardado"); sync(true); }
  else if (id === "theme") { S.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; save(); applyTheme(); }
  else if (id === "l-setup") setupAdmin($("#l-user").value, $("#l-pass").value, $("#l-pass2").value, $("#l-url") ? $("#l-url").value : "");
  else if (id === "l-sw") { showLogin = true; render(); }
  else if (id === "l-go") login($("#l-user").value, $("#l-pass").value, $("#l-url") ? $("#l-url").value : "");
  else if (id === "logout" || id === "hlogout") { AF = ""; S.ok = false; S.pass = ""; S.role = ""; U = { mnew: "", list: null, err: "", f: { user: "", pass: "", role: "agente" } }; tab = "rec"; save(); render(); }
  else if (id === "utest") test();
  else if (id === "uopen") { if (S.url) window.open(S.url, "_blank", "noopener"); }
  else if (id === "usync") sync(true);
  else if (id === "bk") backup();
  else if (id === "rs") resendAll();
});
document.addEventListener("input", e => {
  const i = e.target.id;
  if (i === "f-phone") { e.target.value = F.phone = e.target.value.replace(/\D/g, ""); $("#n1").disabled = !F.phone; $("#f-hist").innerHTML = reinc(F.phone); }
  else if (i === "f-q") { F.q = e.target.value; $("#mot").innerHTML = motivos(getMot().filter(m => m.toLowerCase().includes(F.q.toLowerCase().trim()))); }
  else if (i === "f-desc") F.desc = e.target.value;
  else if (i === "m-new") U.mnew = e.target.value;
  else if (i === "q-new") Q.n = e.target.value;
  else if (i === "u-user") U.f.user = e.target.value;
  else if (i === "u-pass") U.f.pass = e.target.value;
  else if (i === "r-q") { RF.q = e.target.value; updRec(); }
  else if (i === "v-num") { e.target.value = V.number = e.target.value.replace(/\D/g, ""); }
});
document.addEventListener("change", e => {
  const i = e.target.id;
  if (i === "auto") { S.auto = e.target.checked; save(); }
  else if (i === "a-r" || i === "a-v" || i === "a-s") { AF = e.target.value; render(); }
  else if (i === "r-day") { if (e.target.value) { SD = e.target.value; render(); } }
  else if (i === "u-role") U.f.role = e.target.value;
  else if (i === "q-m") { Q.m = e.target.value; render(); }
  else if (i === "p-rem") { S.remindMin = +e.target.value; save(); render(); }
  else if (i === "q-learn") { const v = +e.target.value; S.qlearn = v ? 1 : 0; if (v) S.qlearnMin = v; cfgTouch(); render(); }
  else if (i === "q-sort") { S.qsort = e.target.checked; cfgTouch(); render(); }
  else if (i === "r-m") { RF.m = e.target.value; updRec(); }
  else if (i === "r-d") { RF.d = e.target.value; updRec(); }
});

/* ---------- Enter = siguiente paso (Shift+Enter = salto de linea en el detalle) ---------- */
document.addEventListener("keydown", e => {
  if (gated()) { if (e.key === "Enter" && /^l-/.test(e.target.id || "") && e.target.tagName !== "BUTTON") { e.preventDefault(); ($("#l-go") || $("#l-setup")).click(); } return; }
  if (e.key === "Enter" && e.target.id === "m-new") { e.preventDefault(); motAdd(); return; }
  if (e.key === "Enter" && e.target.id === "q-new") { e.preventDefault(); qAdd(); return; }
  if (tab === "rec" && !e.isComposing && !e.ctrlKey && !e.metaKey) {
    if (F.step === 2 && (e.key === "ArrowDown" || e.key === "ArrowUp") && e.target.tagName !== "SELECT") {   // flechas: elegir motivo sin mouse
      const l = getMot().filter(m => m.toLowerCase().includes(F.q.toLowerCase().trim()));
      if (l.length) { e.preventDefault(); const i = l.indexOf(F.type); F.type = l[e.key === "ArrowDown" ? Math.min(l.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1)]; render(); const el = document.querySelector("#mot .opt.on"); if (el) el.scrollIntoView({ block: "nearest" }); }
      return;
    }
    const km = /^(?:Digit|Numpad)([1-9])$/.exec(e.code || "");   // Alt+1..9 (o solo 1..9 fuera de un campo): marca el detalle rapido
    if (F.step === 3 && km && (e.altKey || !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) { const t = quickFor(F.type)[+km[1] - 1]; if (t) { e.preventDefault(); quickToggle(t); } return; }
  }
  if (e.key !== "Enter" || e.shiftKey || e.isComposing || tab !== "rec" || e.target.tagName === "BUTTON" || e.target.id === "r-q") return;
  e.preventDefault();
  if (F.step === 1) { if (F.phone) { F.step = 2; render(); } }
  else if (F.step === 2) {
    if (!F.type) { const l = getMot().filter(m => m.toLowerCase().includes(F.q.toLowerCase().trim())); if (l.length) F.type = l[0]; }
    if (F.type) { F.step = 3; render(); }
  }
  else if (F.step === 3) { F.step = 4; render(); }
  else saveRec();
});

/* ---------- Inicio ---------- */
load(); applyTheme(); if (normalize()) save(); render();
if (S.url) sync();
setInterval(() => { if (S.url && !document.hidden) sync(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.url) sync(); });
addEventListener("online", () => sync());
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));   // instalable y sin internet cuando se publica con https
</script>
</body>
